<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator - Bilal Tools</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Bilal Tools</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></nav></div></header><main class="tool"><a class="back" href="index.html">← Home</a><h1>EMI Calculator</h1><div class="field"><label>Loan amount</label><input id="a" type="number"></div><div class="field"><label>Annual interest rate (%)</label><input id="r" type="number" step="0.01"></div><div class="field"><label>Loan term (months)</label><input id="m" type="number"></div><button onclick="calc()">Calculate EMI</button><div id="out" class="result" style="display:none"></div></main><script>function calc(){let a=+document.getElementById('a').value,r=+document.getElementById('r').value/1200,m=+document.getElementById('m').value;if(a<=0||m<=0)return;let e=r===0?a/m:a*r*Math.pow(1+r,m)/(Math.pow(1+r,m)-1),o=document.getElementById('out');o.style.display='block';o.textContent=`Estimated monthly EMI: ${e.toFixed(2)}`}</script></body></html>
