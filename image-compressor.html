<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Compressor - Bilal Tools</title><meta name="description" content="Compress JPG, PNG and WebP images in your browser for free.">
<style>body{font-family:Arial;max-width:800px;margin:auto;padding:25px;background:#f6f7fb}.card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 2px 12px #0001}input,button{margin:10px 0;padding:10px}button{border:0;border-radius:8px;cursor:pointer}img{max-width:100%;margin-top:15px}.row{display:grid;gap:10px}</style></head>
<body><h1>Image Compressor</h1><p>Choose an image and compress it directly in your browser.</p>
<div class="card"><input id="file" type="file" accept="image/*"><label>Quality: <span id="qv">70%</span></label><input id="q" type="range" min="10" max="100" value="70"><div><button id="go">Compress</button></div><p id="info"></p><img id="preview"></div>
<script>
q.oninput=()=>qv.textContent=q.value+'%';
go.onclick=()=>{let f=file.files[0];if(!f)return alert('Select an image first.');let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),x=c.getContext('2d');c.width=im.width;c.height=im.height;x.drawImage(im,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed-'+f.name.replace(/\.[^.]+$/,'')+'.jpg';a.textContent='Download compressed image';info.innerHTML='Original: '+Math.round(f.size/1024)+' KB | New: '+Math.round(b.size/1024)+' KB<br>';info.appendChild(a)},'image/jpeg',q.value/100)},im.src=URL.createObjectURL(f)};
</script></body></html>
