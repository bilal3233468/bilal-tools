<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter - Bilal Tools</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Bilal Tools</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></nav></div></header><main class="tool"><a class="back" href="index.html">← Home</a><h1>Word & Character Counter</h1><div class="field"><textarea id="t" placeholder="Type or paste your text here..." oninput="count()"></textarea></div><div id="out" class="result">Words: 0 | Characters: 0 | Characters without spaces: 0</div></main><script>function count(){let t=document.getElementById('t').value,w=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById('out').textContent=`Words: ${w} | Characters: ${t.length} | Characters without spaces: ${t.replace(/\s/g,'').length}`}</script></body></html>
