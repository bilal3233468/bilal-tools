<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature Maker | Bilal Tools</title><meta name="description" content="Draw and download a signature as PNG."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Signature Maker</h1><p class="muted">Draw your signature on the canvas and download it as a PNG.</p><div class="tool"><canvas id="c" width="700" height="280" style="max-width:100%;border:1px solid #ccd9d5;border-radius:10px;background:#fff"></canvas><div class="actions"><button class="btn" onclick="download()">Download PNG</button><button class="btn secondary" onclick="clearC()">Clear</button></div></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let down=false;x.lineWidth=3;x.lineCap='round';function pos(e){let r=c.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}}c.onmousedown=e=>{down=true;let p=pos(e);x.beginPath();x.moveTo(p.x,p.y)};c.onmousemove=e=>{if(!down)return;let p=pos(e);x.lineTo(p.x,p.y);x.stroke()};onmouseup=()=>down=false;c.ontouchstart=e=>{down=true;let p=pos(e);x.beginPath();x.moveTo(p.x,p.y);e.preventDefault()};c.ontouchmove=e=>{if(!down)return;let p=pos(e);x.lineTo(p.x,p.y);x.stroke();e.preventDefault()};c.ontouchend=()=>down=false;function clearC(){x.clearRect(0,0,c.width,c.height)}function download(){let a=document.createElement('a');a.download='signature.png';a.href=c.toDataURL('image/png');a.click()}</script></body></html>
