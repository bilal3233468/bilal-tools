<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator - Bilal Tools</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Bilal Tools</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></nav></div></header><main class="tool"><a class="back" href="index.html">← Home</a><h1>BMI Calculator</h1><div class="field"><label>Weight (kg)</label><input id="w" type="number"></div><div class="field"><label>Height (cm)</label><input id="h" type="number"></div><button onclick="calc()">Calculate BMI</button><div id="out" class="result" style="display:none"></div><p><small>BMI is a general screening measure and is not a medical diagnosis.</small></p></main><script>function calc(){let w=+document.getElementById('w').value,h=+document.getElementById('h').value/100;if(w<=0||h<=0)return;let b=w/(h*h),o=document.getElementById('out');o.style.display='block';o.textContent=`Your BMI is ${b.toFixed(1)}.`}</script></body></html>
