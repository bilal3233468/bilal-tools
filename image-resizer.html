<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resize & Compress | Bilal Tools</title><meta name="description" content="Resize and compress images directly in your browser."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Image Resize & Compress</h1><p class="muted">Process your image in the browser and download the result.</p><div class="tool"><input id="file" type="file" accept="image/*"><div class="grid"><label>Width (px)<input id="w" type="number" placeholder="1200"></label><label>Quality (0.1–1)<input id="q" type="number" step="0.1" min="0.1" max="1" value="0.8"></label></div><button class="btn" onclick="process()">Resize & Compress</button><a id="dl" class="btn secondary" style="display:none">Download</a><div id="info" class="notice" style="margin-top:15px"></div></div></main><script>function process(){let f=file.files[0];if(!f)return info.textContent='Please select an image.';let im=new Image();im.onload=()=>{let width=Number(w.value)||im.width;let scale=width/im.width;let c=document.createElement('canvas');c.width=width;c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{let u=URL.createObjectURL(b);dl.href=u;dl.download='compressed-image.jpg';dl.style.display='inline-block';info.textContent=`Original: ${(f.size/1024).toFixed(1)} KB → New: ${(b.size/1024).toFixed(1)} KB`},'image/jpeg',Math.min(1,Math.max(.1,Number(q.value)||.8)))};im.src=URL.createObjectURL(f)}</script></body></html>
