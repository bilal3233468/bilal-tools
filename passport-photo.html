<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker - Bilal Tools</title><meta name="description" content="Create a standard-size photo canvas."><link rel="canonical" href="https://bilal3233468.github.io/bilal-tools/passport-photo.html"><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><header><nav><a class="brand" href="index.html">Bilal Tools</a><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></div></nav></header><main class="wrap"><div class="hero"><span class="hero-badge">🪪 Creator</span><h1>Passport Photo Maker</h1><p>Create a standard-size photo canvas.</p></div><section class="tool"><input id="file" type="file" accept="image/*"><label>Output quality</label><input id="q" type="range" min="0.2" max="1" step="0.1" value="0.8"><button class="btn" onclick="processImage()">Process Image</button><canvas id="canvas" style="max-width:100%;margin-top:15px"></canvas><div id="out" class="result"></div><p class="muted" style="color:#64748b;margin-top:20px">Bilal Tools processes most inputs directly in your browser.</p></section><div class="ad">Advertisement</div></main><footer><div class="footer-brand">Bilal Tools</div><div><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="disclaimer.html">Disclaimer</a><a href="terms.html">Terms</a></div><p>© 2026 Bilal Tools · Multan, Pakistan</p></footer><script>function processImage(){const f=document.getElementById('file').files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.getElementById('canvas'),ctx=c.getContext('2d');let w=im.width,h=im.height;if('passport-photo'==='passport-photo'){w=600;h=600;}c.width=w;c.height=h;ctx.drawImage(im,0,0,w,h);c.toBlob(b=>document.getElementById('out').innerHTML=`Processed image: ${(b.size/1024).toFixed(1)} KB <a class="btn" download="bilal-tools-image.jpg" href="${URL.createObjectURL(b)}">Download</a>`,'image/jpeg',+document.getElementById('q').value)};im.src=URL.createObjectURL(f)}</script></body></html>
