<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Frequency Counter - Bilal Tools</title><meta name="description" content="Count how often words appear in your text."><link rel="canonical" href="https://bilal3233468.github.io/bilal-tools/frequency-counter.html"><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><header><nav><a class="brand" href="index.html">Bilal Tools</a><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></div></nav></header><main class="wrap"><div class="hero"><span class="hero-badge">📊 Text</span><h1>Word Frequency Counter</h1><p>Count how often words appear in your text.</p></div><section class="tool"><textarea id="in"></textarea><button class="btn" onclick="countWords()">Count</button><div id="out" class="result"></div><p class="muted" style="color:#64748b;margin-top:20px">Bilal Tools processes most inputs directly in your browser.</p></section><div class="ad">Advertisement</div></main><footer><div class="footer-brand">Bilal Tools</div><div><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="disclaimer.html">Disclaimer</a><a href="terms.html">Terms</a></div><p>© 2026 Bilal Tools · Multan, Pakistan</p></footer><script>function countWords(){let a=document.getElementById('in').value.toLowerCase().match(/[a-z0-9]+/g)||[],m={};a.forEach(w=>m[w]=(m[w]||0)+1);out.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+': '+x[1]).join('<br>')}</script></body></html>
