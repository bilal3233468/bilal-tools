<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Maker | Bilal Tools</title><meta name="description" content="Create a printable invoice online."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Invoice Maker</h1><p class="muted">Create a simple printable invoice in your browser. Nothing is uploaded.</p><div class="tool"><div class="grid"><label>Business / Seller<input id="seller" value="Wahaj Enterprises"></label><label>Customer<input id="customer" placeholder="Customer name"></label><label>Invoice No.<input id="inv" value="INV-001"></label><label>Date<input id="date" type="date"></label></div><textarea id="items" rows="6" placeholder="Item | Qty | Price
Syringe 3cc | 10 | 585"></textarea><div class="actions"><button class="btn" onclick="make()">Generate Invoice</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div><div id="out" class="preview"></div></div></main><script>function make(){let rows=document.getElementById('items').value.trim().split(/\n+/).map(x=>x.split('|').map(y=>y.trim()));let total=0;let html='<h2>'+document.getElementById('seller').value+'</h2><p>Invoice: '+document.getElementById('inv').value+' | Date: '+document.getElementById('date').value+'</p><p>Bill To: '+document.getElementById('customer').value+'</p><table style="width:100%;border-collapse:collapse"><tr><th align="left">Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>';rows.forEach(r=>{let q=+r[1]||0,p=+r[2]||0,t=q*p;total+=t;html+=`<tr><td>${r[0]||''}</td><td align="center">${q}</td><td align="right">${p.toFixed(2)}</td><td align="right">${t.toFixed(2)}</td></tr>`});html+=`</table><h3 style="text-align:right">Grand Total: ${total.toFixed(2)}</h3>`;document.getElementById('out').innerHTML=html}</script></body></html>
