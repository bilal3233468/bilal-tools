<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visiting Card Maker | Bilal Tools</title><meta name="description" content="Free online visiting card and business card maker."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Visiting Card Maker</h1><p class="muted">Create a clean business card, preview it instantly, and print or save it as PDF.</p><div class="grid"><section class="tool"><label>Name<input id="name" placeholder="Muhammad Bilal"></label><label>Job / Title<input id="title" placeholder="CEO / General Order Supplier"></label><label>Company<input id="company" placeholder="Wahaj Enterprises"></label><label>Phone<input id="phone" placeholder="+92 300 7556626"></label><label>Email<input id="email" placeholder="you@example.com"></label><label>Address<input id="address" placeholder="Multan, Pakistan"></label><div class="actions"><button class="btn" onclick="update()">Update Card</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div></section><section class="preview"><div id="card" style="max-width:560px;aspect-ratio:1.75;background:linear-gradient(135deg,#103b32,#0b6b57);color:white;border-radius:16px;padding:32px;display:flex;flex-direction:column;justify-content:center"><div style="font-size:27px;font-weight:800" id="pname">Muhammad Bilal</div><div id="ptitle">CEO / General Order Supplier</div><hr style="width:100%;border:0;border-top:1px solid #ffffff66"><div style="font-size:20px;font-weight:700" id="pcompany">Wahaj Enterprises</div><div id="pcontact">+92 300 7556626 · you@example.com</div><div id="paddress">Multan, Pakistan</div></div></section></div></main><script>function update(){for(const [i,id] of [['name','pname'],['title','ptitle'],['company','pcompany'],['address','paddress']])document.getElementById(id).textContent=document.getElementById(i).value||document.getElementById(id).textContent;let ph=document.getElementById('phone').value||'';let em=document.getElementById('email').value||'';document.getElementById('pcontact').textContent=[ph,em].filter(Boolean).join(' · ')}</script></body></html>
