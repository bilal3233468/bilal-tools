<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number to Words | Bilal Tools</title><meta name="description" content="Convert numbers into words online."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Number to Words</h1><div class="tool"><input id="num" type="number" placeholder="1234567"><select id="currency"><option>Number</option><option>Rupees</option></select><button class="btn" onclick="convert()">Convert</button><div id="out" class="notice" style="margin-top:15px"></div></div></main><script>const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function under(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+under(n%100):'')}function words(n){n=Math.floor(n);if(n===0)return'Zero';let a=[];for(const [v,w] of [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']])if(n>=v){a.push(under(Math.floor(n/v))+' '+w);n%=v}if(n)a.push(under(n));return a.join(' ')}function convert(){let n=Number(num.value);out.textContent=Number.isFinite(n)&&n>=0?words(n)+(currency.value==='Rupees'?' Rupees Only':''):'Enter a valid number'}</script></body></html>
