<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt Maker | Bilal Tools</title><meta name="description" content="Create a simple payment receipt online."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Receipt Maker</h1><div class="tool"><div class="grid"><label>Business<input id="biz" value="Wahaj Enterprises"></label><label>Received From<input id="from" placeholder="Customer name"></label><label>Amount<input id="amount" type="number" placeholder="5000"></label><label>Payment For<input id="for" placeholder="Goods / Service"></label></div><button class="btn" onclick="gen()">Generate Receipt</button> <button class="btn secondary" onclick="window.print()">Print / Save PDF</button><div id="out" class="preview"></div></div></main><script>function gen(){document.getElementById('out').innerHTML=`<div style="text-align:center"><h2>${biz.value}</h2><p>PAYMENT RECEIPT</p><hr><p>Received from <b>${from.value}</b></p><h1>${Number(amount.value||0).toFixed(2)}</h1><p>For: ${document.getElementById('for').value}</p><p>Date: ${new Date().toLocaleDateString()}</p></div>`}</script></body></html>
