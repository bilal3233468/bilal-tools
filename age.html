<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator - Bilal Tools</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Bilal Tools</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></nav></div></header><main class="tool"><a class="back" href="index.html">← Home</a><h1>Age Calculator</h1><p>Enter your date of birth to calculate your age.</p><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><button onclick="calc()">Calculate Age</button><div id="out" class="result" style="display:none"></div></main><script>function calc(){let d=new Date(document.getElementById('dob').value);if(isNaN(d)){return}let n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}let o=document.getElementById('out');o.style.display='block';o.textContent=`Your age is ${y} years, ${m} months and ${day} days.`}</script></body></html>
