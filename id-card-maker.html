<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID Card Maker | Bilal Tools</title><meta name="description" content="Create a simple printable employee ID card."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>ID Card Maker</h1><div class="grid"><section class="tool"><label>Name<input id="name" placeholder="Muhammad Bilal"></label><label>ID / Employee No.<input id="id" placeholder="EMP-001"></label><label>Company<input id="company" value="Wahaj Enterprises"></label><label>Designation<input id="role" placeholder="Manager"></label><label>Phone<input id="phone" placeholder="+92 300 7556626"></label><button class="btn" onclick="gen()">Generate</button> <button class="btn secondary" onclick="window.print()">Print / Save PDF</button></section><section class="preview"><div id="out" style="max-width:360px;background:#fff;border:2px solid #0b6b57;border-radius:16px;padding:24px;text-align:center"><div style="font-size:22px;font-weight:bold;color:#0b6b57">WAHAJ ENTERPRISES</div><div style="margin:30px 0;font-size:20px;font-weight:bold" id="n">Your Name</div><p id="r">Designation</p><p>ID: <span id="i">EMP-001</span></p><p id="ph">Phone</p></div></section></div></main><script>function gen(){n.textContent=name.value||'Your Name';r.textContent=role.value||'Designation';i.textContent=id.value||'EMP-001';ph.textContent=phone.value||''}</script></body></html>
