<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterhead Maker | Bilal Tools</title><meta name="description" content="Create a simple printable business letterhead."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="creator-tools.css"></head><body><header><nav><strong>Bilal Tools</strong><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav></header><main class="wrap"><h1>Letterhead Maker</h1><div class="grid"><section class="tool"><label>Company Name<input id="company" value="Wahaj Enterprises"></label><label>Tagline<input id="tag" value="Government Contractor & General Order Supplier"></label><label>Phone / Email<input id="contact" value="+92 300 7556626 | bilal3233468@gmail.com"></label><label>Address<input id="addr" value="Multan, Pakistan"></label><label>Letter Content<textarea id="content" rows="10" placeholder="Write your letter..."></textarea></label><button class="btn" onclick="gen()">Preview</button> <button class="btn secondary" onclick="window.print()">Print / Save PDF</button></section><section id="out" class="preview print-area"></section></div></main><script>function gen(){out.innerHTML=`<div style="border-bottom:4px solid #0b6b57;padding-bottom:15px"><h1 style="margin:0">${company.value}</h1><p>${tag.value}</p><small>${contact.value}<br>${addr.value}</small></div><div style="min-height:500px;padding-top:30px;white-space:pre-wrap">${content.value}</div>`}</script></body></html>
