<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator - Bilal Tools</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Bilal Tools</a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></nav></div></header><main class="tool"><a class="back" href="index.html">← Home</a><h1>Percentage Calculator</h1><div class="field"><label>Percentage (%)</label><input id="p" type="number" placeholder="e.g. 15"></div><div class="field"><label>Number</label><input id="n" type="number" placeholder="e.g. 200"></div><button onclick="calc()">Calculate</button><div id="out" class="result" style="display:none"></div></main><script>function calc(){let p=+document.getElementById('p').value,n=+document.getElementById('n').value;if(!isFinite(p)||!isFinite(n))return;let o=document.getElementById('out');o.style.display='block';o.textContent=`${p}% of ${n} = ${(p*n/100).toFixed(2)}`}</script></body></html>
